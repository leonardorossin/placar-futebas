<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<script>/* aplica o tema guardado antes de desenhar, para não piscar escuro */try{if(localStorage.getItem('rachao.placar.tema')==='claro'){document.documentElement.setAttribute('data-tema','claro');document.querySelector('meta[name=theme-color]').content='#f4f1ea';}}catch(e){}</script>
<title>Placar do Futebas</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icones/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Futebas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de app de celular; placar eletrônico no topo do jogo, abas fixas embaixo */
/* Cores do escudo do Futebas: preto, dourado e branco. O app é sempre escuro. */
:root{
  --bg:#000000; --surface:#14120f; --surface-2:#1f1c17; --ink:#f4efe6; --muted:#a59d8f; --line:#2f2a22;
  --accent:#d8ab2f; --accent-i:#140f06; --danger:#ff7b70;
  --board:#0b0a08; --board-ink:#f4efe6; --digit:#f2c23e;
  --scrim:rgba(0,0,0,.7); --shadow:rgba(0,0,0,.6);
  --laranja:#ff7a2e; --laranja-i:#1f0b00; --azul:#4dabf7; --azul-i:#04172a;
  --amarelo:#fcc419; --amarelo-i:#241b00; --roxo:#c77dff; --roxo-i:#1d0530;
  --verde:#51cf66; --verde-i:#03190a; --vermelho:#ff6b6b; --vermelho-i:#2b0505;
  --preto:#3d3a36; --preto-i:#ffffff; --branco:#f4efe6; --branco-i:#1a1712;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
/* Tema claro (escolhido no botão de sol/lua, guardado em cada celular). O placar e os quadros de destaque
   continuam escuros, como um placar de estádio. O dourado fica mais escuro para dar leitura no fundo claro. */
:root[data-tema="claro"]{
  --bg:#f4f1ea; --surface:#ffffff; --surface-2:#efe9de; --ink:#1b1712; --muted:#675f53; --line:#ddd4c4;
  --accent:#9a6a0a; --accent-i:#ffffff; --danger:#c0392b;
  --scrim:rgba(27,23,18,.45); --shadow:rgba(60,45,20,.18);
  --laranja:#f76707; --laranja-i:#ffffff; --azul:#1c7ed6; --azul-i:#ffffff;
  --amarelo:#f5b70a; --amarelo-i:#241b00; --roxo:#9c36b5; --roxo-i:#ffffff;
  --verde:#2f9e44; --verde-i:#ffffff; --vermelho:#e03131; --vermelho-i:#ffffff;
  --preto:#2b2824; --preto-i:#ffffff; --branco:#ffffff; --branco-i:#1a1712;
  color-scheme:light;
}
:root[data-tema="claro"] .escudo,:root[data-tema="claro"] .escudo-g{mix-blend-mode:normal}
.topo-dir{display:flex;align-items:center;gap:4px;flex:none}
.bt-tema{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.bt-tema:active{transform:scale(.94)}
.bt-tema svg{width:20px;height:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body.travado{overflow:hidden}
button,a,input,select,textarea{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
p{margin:0}
h2,h3{margin:0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1;text-wrap:balance}
h2{font-size:28px} h3{font-size:24px}

.cor-laranja{--c:var(--laranja);--ci:var(--laranja-i)} .cor-azul{--c:var(--azul);--ci:var(--azul-i)}
.cor-amarelo{--c:var(--amarelo);--ci:var(--amarelo-i)} .cor-roxo{--c:var(--roxo);--ci:var(--roxo-i)}
.cor-verde{--c:var(--verde);--ci:var(--verde-i)} .cor-vermelho{--c:var(--vermelho);--ci:var(--vermelho-i)}
.cor-preto{--c:var(--preto);--ci:var(--preto-i)} .cor-branco{--c:var(--branco);--ci:var(--branco-i)}

.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(92px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}

.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 14px}
.id{display:flex;align-items:center;gap:12px;min-width:0}
/* lighten: o fundo preto da imagem some em qualquer fundo escuro */
.escudo{width:54px;height:auto;flex:none;mix-blend-mode:lighten}
.escudo-g{width:130px;height:auto;align-self:center;mix-blend-mode:lighten}
.marca{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:.95;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.data{color:var(--muted);font-size:14px;font-weight:600;text-transform:capitalize}
/* Conta no topo: avatar redondo (inicial do e-mail no administrador, ícone de pessoa no visitante) com bolinha de situação */
.selo{appearance:none;background:none;border:0;padding:2px;cursor:pointer;display:grid;place-items:center;min-width:44px;min-height:44px;flex:none}
.avatar{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 19px/1 var(--f-display);text-transform:uppercase;background:var(--accent);color:var(--accent-i);flex:none}
.avatar.visit{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.avatar svg{width:22px;height:22px}
.avatar .pt{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:#2fb344}
.avatar .pt.env{background:var(--digit)} .avatar .pt.off{background:var(--danger)}
.avatar.g{width:56px;height:56px;font-size:26px} .avatar.g svg{width:30px;height:30px}
.avatar .olho{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-i);display:grid;place-items:center;border:2px solid var(--bg)}
.avatar .olho svg,.avatar.g .olho svg{width:11px;height:11px}
.avatar.g .olho{width:24px;height:24px} .avatar.g .olho svg{width:14px;height:14px}
.selo-txt{appearance:none;border:1px solid var(--accent);background:none;color:var(--accent);font:700 14px var(--f-body);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.selo-txt.exemplo{border-color:var(--digit);color:var(--ink)}
.conta-top{display:flex;align-items:center;gap:12px}
.conta-top b{display:block;overflow-wrap:anywhere}

.rot{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mudo{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.aviso{background:color-mix(in srgb,var(--digit) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--digit) 55%,var(--line));border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:14px}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px/1.2 var(--f-body);border-radius:12px;min-height:48px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.prim,.btn.zap{background:var(--accent);border-color:var(--accent);color:var(--accent-i)}
.btn.perigo{color:var(--danger)}
.btn.bloco{width:100%}
.btn.grande{min-height:58px;font-size:18px}
.btn.mini{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-link{appearance:none;border:0;background:none;color:var(--accent);font:600 15px var(--f-body);padding:8px 0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.col-btns{display:flex;flex-direction:column;gap:10px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duas .btn{padding-left:10px;padding-right:10px;gap:6px}

/* Placar eletrônico */
.placar{background:var(--board);color:var(--board-ink);border-radius:20px;padding:14px 16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.placar-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--board-ink) 65%,transparent)}
.placar-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.lado{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.dig{font:800 84px/.85 var(--f-display);color:var(--digit);font-variant-numeric:tabular-nums;text-shadow:0 0 22px color-mix(in srgb,var(--digit) 40%,transparent)}
.lado-nome{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;max-width:100%;min-width:0}
.lado-nome .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font:800 26px var(--f-display);color:color-mix(in srgb,var(--board-ink) 35%,transparent);padding-bottom:26px}
/* Cor do colete: uma camisetinha da cor do time, com contorno fino para aparecer em qualquer fundo */
.colete{width:17px;height:17px;flex:none;overflow:visible}
.colete path,.swatch path{fill:var(--c);stroke:color-mix(in srgb,currentColor 45%,transparent);stroke-width:1.3;stroke-linejoin:round}

/* Campo: botões de gol */
.dica{font-size:14px;color:var(--muted);text-align:center}
.campo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coluna{display:flex;flex-direction:column;gap:8px;min-width:0}
.coluna-topo{background:var(--c);color:var(--ci);border-radius:12px;padding:8px 12px;font:800 19px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 10%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jog{appearance:none;width:100%;min-height:56px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 10px 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;font:600 16px var(--f-body);text-align:left;cursor:pointer;transition:transform .08s ease}
.jog:active{transform:scale(.97)}
.jog .nm{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15;overflow-wrap:anywhere;min-width:0}
.qt{display:inline-flex;align-items:center;gap:4px;font:800 17px/1 var(--f-display);background:var(--surface-2);border-radius:999px;padding:4px 8px;flex:none}
.qt svg{width:13px;height:13px}
.jog.flash{animation:flash .7s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--c) 55%,var(--surface))}100%{background:var(--surface)}}
.contra{display:flex;flex-direction:column;gap:8px}
.contra .duas .btn{border-style:dashed;font-size:14px;min-height:44px}

.lances{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lance{display:grid;grid-template-columns:1fr 44px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.lance:last-child{border-bottom:0}
.quem{display:flex;align-items:center;gap:8px;min-width:0}
.quem .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.quem .mudo{white-space:nowrap}
.x{appearance:none;border:0;background:none;color:var(--muted);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.x svg{width:18px;height:18px}

.res{font:800 34px/1 var(--f-display);text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.res .n{color:var(--accent)}
.prox-sel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.vs2{font:800 22px var(--f-display);color:var(--muted)}

/* Times */
.barra{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linha-rot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);font:700 16px var(--f-body);min-width:52px;min-height:44px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-i)}
.time-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.time-head{display:flex;align-items:center;gap:10px}
.swatch{appearance:none;width:40px;height:40px;border:0;background:none;padding:0;display:grid;place-items:center;flex:none;cursor:pointer;color:var(--ink)}
.swatch svg{width:36px;height:36px;overflow:visible}
.swatch:active{transform:scale(.92)}
.tnome{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);border-radius:0;background:transparent;color:var(--ink);font:800 24px var(--f-display);text-transform:uppercase;letter-spacing:.03em;padding:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 15px var(--f-body);min-height:40px;cursor:pointer;max-width:100%;overflow-wrap:anywhere}
.chip.conv{border-style:dashed;background:var(--surface)}
.chip.avul{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--surface)}
.filtros{display:flex;flex-wrap:wrap;gap:8px}
.filtros .chip b{font-weight:800;color:var(--muted);margin-left:2px}
.filtros .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-i)}
.filtros .chip[aria-pressed="true"] b{color:var(--accent-i)}
.av{font-size:.8em;font-weight:600;color:var(--accent);white-space:nowrap;text-transform:none;letter-spacing:0}
.btn-time{justify-content:flex-start}
.btn-time .colete{width:20px;height:20px}
.cores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cores button{appearance:none;border:2px solid var(--line);background:var(--c);color:var(--ci);border-radius:12px;min-height:56px;font:700 13px var(--f-body);cursor:pointer}
.cores button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-width:0}
.ck input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.ck span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Resumo */
.destaques{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dest{background:var(--board);color:var(--board-ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.dest .rot{color:color-mix(in srgb,var(--board-ink) 60%,transparent)}
.dest .v{font:800 26px/1 var(--f-display);text-transform:uppercase;color:var(--digit);overflow-wrap:anywhere}
.dest .s{font-size:14px;color:color-mix(in srgb,var(--board-ink) 75%,transparent)}
.tabela-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:15px}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
td:first-child,th:first-child{text-align:left;padding-left:14px}
td.tm{display:flex;align-items:center;gap:8px;font-weight:600}
td.pts{font:800 20px var(--f-display)}
.rank{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.rank li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:0}
.rank .pos{font:800 18px var(--f-display);color:var(--muted)}
.rank .g{font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.rank .quem .nm{white-space:normal}
.jogos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.jogos li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.linha-bt{appearance:none;background:none;border:0;color:inherit;font:inherit;width:100%;text-align:left;cursor:pointer}
.rank li.cl{padding:0;display:block}
.rank .linha-bt{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 14px}
.jogos li.cl{padding:0}
.jogos .linha-bt{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:12px}
.linha-bt:active{background:var(--surface-2)}
.perigo-link{color:var(--danger);align-self:center}
.jogos .l1{display:flex;gap:10px;align-items:baseline;font-weight:700}
.jogos .l1 .n{font:800 16px var(--f-display);color:var(--muted)}
.tag{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
details.dia{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
details.dia summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:44px;font-weight:700;list-style:none}
details.dia summary::-webkit-details-marker{display:none}
.dia-in{display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}

/* Elenco */
.bloco-f{display:flex;flex-direction:column;gap:10px}
input[type=text],input[type=email],input[type=password],textarea,select{font:500 16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px;width:100%}
textarea{min-height:160px;resize:vertical}
select{appearance:auto}
.linha{display:flex;gap:8px}
.linha input{flex:1;min-width:0}
.lista{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.lista li{display:flex;align-items:center;gap:6px;padding:4px 0 4px 12px;border-bottom:1px solid var(--line);min-height:52px}
.lista li:last-child{border-bottom:0}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;padding:6px 0}
.lista .nm{background:none;border:0;color:var(--ink);font:600 16px var(--f-body);text-align:left;padding:2px 0;cursor:pointer;overflow-wrap:anywhere}
.gl{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.niv{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;align-self:flex-start}
.niv button{appearance:none;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);font:700 12px var(--f-body);min-width:39px;min-height:40px;padding:0 4px;cursor:pointer}
.niv button:first-child{border-left:0}
.niv button[aria-pressed="true"]{background:var(--accent);color:var(--accent-i)}
.lista .niv{align-self:center}
.forca{white-space:nowrap}
.mes{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mes b{font-size:17px}

/* Futebas (história do grupo) */
.capa{align-items:center;text-align:center;gap:8px;padding:20px 16px}
.capa h2{font-size:40px;color:var(--accent)}
.unif{gap:14px}
.unif-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.unif-foto{appearance:none;border:0;padding:6px 0;background:radial-gradient(ellipse at center,var(--surface-2),transparent 70%);border-radius:12px;overflow:hidden;cursor:zoom-in;display:block;width:100%}
.unif-foto.molde{background:#fff;padding:0;cursor:auto}
.unif-foto img{display:block;width:100%;height:auto}
.unif-vazio{border:1px dashed var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;padding:16px;text-align:center}
.unif-vazio svg{width:48px;height:48px;color:var(--accent)}
.elenco-u{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.elenco-u li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 12px;min-height:44px;min-width:0}
.elenco-u .nm{font-weight:600;overflow-wrap:anywhere;min-width:0}
.elenco-u .num{font:800 22px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.dest-bt{appearance:none;border:0;font:inherit;text-align:left;cursor:pointer;width:100%}
.dest-bt:active{transform:scale(.98)}
.campeoes{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.campeoes li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.campeoes li:last-child{border-bottom:0}
.campeoes .m{font-size:14px;color:var(--muted);text-transform:capitalize}
.campeoes .q{font-weight:700;text-align:right}

.vazio{padding:20px;border:1px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.passos{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.passos li::marker{font-family:var(--f-display);font-weight:800;color:var(--accent)}

/* Abas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{appearance:none;border:0;background:none;color:var(--muted);font:700 11px var(--f-body);letter-spacing:.03em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;min-height:62px;cursor:pointer}
.nav button[aria-current="page"]{color:var(--accent)}
.nav svg{width:24px;height:24px}

/* Folha e aviso */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;width:min(528px, calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));box-shadow:0 10px 28px var(--shadow)}
.toast .tx{font-weight:700}
.toast .ta{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast .ta a,.toast .ta button{appearance:none;color:var(--bg);font:700 14px var(--f-body);background:none;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:10px;padding:8px 12px;text-decoration:none;cursor:pointer;min-height:40px;display:inline-flex;align-items:center}
.toast .ta a{background:var(--accent);border-color:var(--accent);color:var(--accent-i)}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
@media (max-width:360px){ .dig{font-size:68px} .checks{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="app" id="app"></div>

<nav class="nav" aria-label="Abas">
  <div class="nav-in">
    <button data-a="aba" data-v="jogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.6l4.1 3-1.6 4.8h-5l-1.6-4.8z" fill="currentColor" stroke="none"/><path d="M12 7.6V3.2M16.1 10.6l4.2-1.4M14.5 15.4l2.6 3.7M9.5 15.4l-2.6 3.7M7.9 10.6 3.7 9.2"/></svg>Jogo</button>
    <button data-a="aba" data-v="times"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3 3 6.2l2.2 4.3 2.3-1.1V21h9V9.4l2.3 1.1L21 6.2 15.5 3c-.6 1.7-1.9 2.7-3.5 2.7S9.1 4.7 8.5 3z"/></svg>Times</button>
    <button data-a="aba" data-v="resumo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5A3.5 3.5 0 0 1 16.5 11M12 14v4M8 21h8M9.5 18h5"/></svg>Resumo</button>
    <button data-a="aba" data-v="elenco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.4 2.7-6 6-6s6 2.6 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.8 14.1c2.9.4 5.2 2.7 5.2 5.9"/></svg>Elenco</button>
    <button data-a="aba" data-v="sortear" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>Sortear</button>
    <button data-a="aba" data-v="futebas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8 4.5 5.6v6c0 4.6 3.1 8 7.5 9.6 4.4-1.6 7.5-5 7.5-9.6v-6z"/><path d="m12 8 1.3 2.6 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4z" fill="currentColor" stroke="none"/></svg>Futebas</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

var LS = 'rachao.placar.v1', LS_ABA = 'rachao.placar.aba';
/* Modo de entrada: 'admin' (login, pode tudo) ou 'visitante' (só vê; dados da vitrine, sem níveis). Sem modo = tela de entrada. */
var LS_MODO = 'rachao.placar.modo', LS_VITRINE = 'rachao.placar.vitrine';
var IDS = ['A','B','C','D'];
var CORES = {laranja:'Laranja',azul:'Azul',amarelo:'Amarelo',roxo:'Roxo',verde:'Verde',vermelho:'Vermelho',preto:'Preto',branco:'Branco'};
var CORES_PADRAO = ['laranja','azul','amarelo','roxo'];
var NIVEIS = {1:'Fraco', 2:'Médio', 3:'Bom', 4:'Pro'};

var ICON = {
  bola:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7.4l4.2 3-1.6 4.9H9.4l-1.6-4.9z" fill="currentColor"/></svg>',
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  enviar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 3 10.5l7 2.5 2.5 7z"/><path d="M21 3 10 13"/></svg>',
  dado:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>',
  mao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ---------- utilidades ---------- */
function $(s, el){ return (el || document).querySelector(s); }
function $$(s, el){ return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid8(){ return Math.random().toString(36).slice(2,10); }
function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtData(iso){ try{ var p = iso.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'}); }catch(e){ return iso; } }
function fmtCurta(iso){ return String(iso).slice(8,10) + '/' + String(iso).slice(5,7); }
function fmtMes(mes){ var p = mes.split('-').map(Number); return new Date(p[0], p[1]-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'}); }
function somarMes(mes, delta){ var p = mes.split('-').map(Number), d = new Date(p[0], p[1]-1+delta, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function pl(n, um, varios){ return n + ' ' + (n === 1 ? um : varios); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function limparNome(s){
  var t = String(s || '');
  try{ t = t.replace(/\p{Extended_Pictographic}/gu, ''); }catch(e){}
  return t.replace(/^[\s\d.)\-–—:•*#]+/, '').replace(/[*_~]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40);
}
function embaralhar(a){
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--){
    var k;
    try{ var r = new Uint32Array(1); crypto.getRandomValues(r); k = r[0] % (i+1); }catch(e){ k = Math.floor(Math.random()*(i+1)); }
    var tmp = a[i]; a[i] = a[k]; a[k] = tmp;
  }
  return a;
}
/* Link do WhatsApp com a mensagem pronta. O wa.me sem número não abre mais a escolha de conversa,
   então no celular usamos o link do próprio aplicativo (abre "Enviar para…") e no computador o WhatsApp Web. */
function ehCelular(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1); }
function wa(txt){ var t = encodeURIComponent(txt); return ehCelular() ? 'whatsapp://send?text=' + t : 'https://web.whatsapp.com/send?text=' + t; }
/* No celular abre o aplicativo na mesma tela (sem aba em branco). No computador também copia o texto:
   se o WhatsApp não mostrar a escolha de conversa, é só abrir o grupo e colar. */
document.addEventListener('click', function(e){
  var a = e.target.closest('a[href^="whatsapp://"], a[href^="https://web.whatsapp.com/"]');
  if (!a) return;
  var txt = decodeURIComponent(a.getAttribute('href').split('text=')[1] || '');
  if (a.getAttribute('href').indexOf('whatsapp://') === 0){ e.preventDefault(); location.href = a.getAttribute('href'); return; }
  try{ navigator.clipboard.writeText(txt).then(function(){ toast('Texto copiado. Se o WhatsApp não pedir a conversa, abra o grupo e cole (Ctrl+V).'); }, function(){}); }catch(err){}
});
function vibrar(){ try{ if (navigator.vibrate) navigator.vibrate(25); }catch(e){} }

/* ---------- estado ---------- */
function novoDia(){ return {data: hojeISO(), times: [], avulsos: [], jogos: [], fila: [], emCampo: [], desde: {}, proximo: null, desempate: null}; }
function ajustarNivel(p){ p.nivel = NIVEIS[p.nivel] ? +p.nivel : 2; }
function estadoVazio(){ return {v:1, grupo:'Futebas', jogadores:[], dia: novoDia(), historico:[], atualizadoEm:0, sobre: sobrePadrao()}; }
/* Aba Futebas: a história do grupo. Começa com o que o Leo passou; dá para editar no app.
   Uniforme: num (1º, 2º…), quando (AAAA-MM), situação, observação e jogadores (nome e número da camisa). */
var SITUACOES = {pronto:'Pronto', producao:'Em produção', decisao:'Em decisão'};
/* Fotos ficam na pasta fotos/ do site (não no banco, que ficaria pesado). Chave = número do uniforme. */
var FOTOS_UNIF = {1:{foto:'/fotos/uniforme-2025.webp', molde:'/fotos/uniforme-1-molde.jpg'}};
function sobrePadrao(){
  var pessoas = 'Gustavo 7|Nildinho 3|Carlet 9|Sócio 10|Jacob 33|Léo 8|Pedrinho 11|Fabrício Patrick 5|Muricy 13|Gil 23|Rafael 99|Amat 55|Guts 17|Vinicius 51|Caio 69|Jao 27|Henrique 777|Ju Calado 12|Rodolfo 100|Muniz 9+1|Fabrício Souza 1+9'
    .split('|').map(function(s){ var i = s.lastIndexOf(' '); return {nome:s.slice(0, i), num:s.slice(i + 1)}; });
  return {criado:'2024-04-08', cidade:'Piracicaba (SP)', uniformes:[
    {id:'u1', num:1, temporada:2025, quando:'2025-05', situacao:'pronto', obs:'', pessoas:pessoas},
    {id:'u2', num:2, temporada:2026, quando:'', situacao:'decisao', obs:'', pessoas:[]}
  ]};
}
function ajustarSobre(st){
  var s = st.sobre;
  if (!s || typeof s !== 'object' || !Array.isArray(s.uniformes)){ st.sobre = sobrePadrao(); return; }
  if (typeof s.criado !== 'string') s.criado = '';
  if (typeof s.cidade !== 'string') s.cidade = '';
  s.uniformes = s.uniformes.filter(function(u){ return u && u.id; });
  s.uniformes.forEach(function(u){
    u.num = +u.num || 1;
    u.temporada = +u.temporada || 2024 + u.num; /* 1º uniforme = temporada 2025, 2º = 2026 */
    if (!SITUACOES[u.situacao]) u.situacao = 'decisao';
    if (typeof u.quando !== 'string') u.quando = '';
    if (typeof u.obs !== 'string') u.obs = '';
    if (!Array.isArray(u.pessoas)) u.pessoas = [];
  });
}
function normalizar(st){
  if (!st || typeof st !== 'object') return estadoVazio();
  st.grupo = (typeof st.grupo === 'string' && st.grupo.trim() && st.grupo !== 'Rachão') ? st.grupo : 'Futebas';
  st.jogadores = Array.isArray(st.jogadores) ? st.jogadores.filter(function(p){ return p && p.id; }) : [];
  st.historico = Array.isArray(st.historico) ? st.historico.filter(function(h){ return h && h.id && Array.isArray(h.jogos); }) : [];
  var d = (st.dia && typeof st.dia === 'object') ? st.dia : novoDia();
  var base = novoDia();
  Object.keys(base).forEach(function(k){ if (d[k] === undefined) d[k] = base[k]; });
  ['times','avulsos','jogos','fila','emCampo'].forEach(function(k){ if (!Array.isArray(d[k])) d[k] = []; });
  if (!d.desde || typeof d.desde !== 'object') d.desde = {};
  if (d.desempate && !Array.isArray(d.desempate.times)) d.desempate = null;
  st.jogadores.forEach(function(p){ ajustarNivel(p); p.avulso = !!p.avulso; }); d.avulsos.forEach(ajustarNivel);
  d.times.forEach(function(t, i){
    if (!Array.isArray(t.jogadores)) t.jogadores = [];
    if (!CORES[t.cor]) t.cor = CORES_PADRAO[i] || 'preto';
    if (/^Time [A-D]$/.test(t.nome)) t.nome = nomePadrao(t.nome.slice(-1)); /* nome antigo: Time A → Time 1 */
  });
  st.dia = d;
  ajustarSobre(st);
  st.atualizadoEm = +st.atualizadoEm || 0;
  return st;
}

var S, real = null, demo = false, aba = 'jogo', mesSel = hojeISO().slice(0, 7), qtdNaMao = false, soMensal = false, filtroNivel = 0, statPer = 'tudo', statOrd = 'aprov';
var toastTimer = null, wakeLock = null;

/* Tema claro/escuro: escolha de cada celular, guardada só nele */
var LS_TEMA = 'rachao.placar.tema';
function temaClaro(){ return document.documentElement.getAttribute('data-tema') === 'claro'; }
function srcEscudo(){ return temaClaro() ? '/icones/escudo-claro.webp' : '/icones/escudo.png'; }
function aplicarTema(claro){
  if (claro) document.documentElement.setAttribute('data-tema', 'claro'); else document.documentElement.removeAttribute('data-tema');
  var mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = claro ? '#f4f1ea' : '#000000';
  try{ if (claro) localStorage.setItem(LS_TEMA, 'claro'); else localStorage.removeItem(LS_TEMA); }catch(e){}
}
var ICON_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
var ICON_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
function htmlBtTema(){ var c = temaClaro(); return '<button class="bt-tema" data-a="tema" aria-label="' + (c ? 'Mudar para o tema escuro' : 'Mudar para o tema claro') + '" title="' + (c ? 'Tema escuro' : 'Tema claro') + '">' + (c ? ICON_LUA : ICON_SOL) + '</button>'; }
function lerAdmin(){ try{ return normalizar(JSON.parse(localStorage.getItem(LS))); }catch(e){ return estadoVazio(); } }
function lerVitrine(){ try{ return normalizar(JSON.parse(localStorage.getItem(LS_VITRINE))); }catch(e){ return estadoVazio(); } }
var modo = null;
try{ modo = localStorage.getItem(LS_MODO); }catch(e){}
if (modo !== 'admin' && modo !== 'visitante') modo = null;
function visitante(){ return modo === 'visitante'; }
function gravarModo(m){ modo = m; try{ if (m) localStorage.setItem(LS_MODO, m); else localStorage.removeItem(LS_MODO); }catch(e){} }

S = lerAdmin();
/* Aparelho que já usava o app (tem dados guardados) continua como administrador, sem tela de entrada */
if (!modo && (S.jogadores.length || S.dia.jogos.length || S.historico.length)) gravarModo('admin');
if (visitante()) S = lerVitrine();
if (!visitante() && S.dia.data !== hojeISO() && !S.dia.jogos.length) S.dia.data = hojeISO();

function salvar(){
  if (demo || visitante()) return;
  S.atualizadoEm = Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  agendarEnvio();
}
function commit(){ salvar(); render(); }

/* ---------- consultas ---------- */
function pessoa(id){
  for (var i = 0; i < S.jogadores.length; i++) if (S.jogadores[i].id === id) return S.jogadores[i];
  for (var k = 0; k < S.dia.avulsos.length; k++) if (S.dia.avulsos[k].id === id) return S.dia.avulsos[k];
  return null;
}
/* Três tipos de jogador:
   - mensalista: no elenco (S.jogadores), vem marcado no sorteio;
   - avulso: no elenco com avulso:true, joga às vezes, vem desmarcado no sorteio;
   - convidado: só do dia (S.dia.avulsos, nome antigo da chave), adicionado na aba Times. */
function ehConvidado(id){ return S.dia.avulsos.some(function(p){ return p.id === id; }); }
function mensalistas(){ return S.jogadores.filter(function(p){ return !p.avulso; }); }
function avulsosFixos(){ return S.jogadores.filter(function(p){ return p.avulso; }); }
function nomeDe(id){ var p = pessoa(id); return p ? p.nome : '—'; }
/* Avulso aparece sempre com "(avulso)" depois do nome: nas mensagens (nomeTxt) e nas telas (nomeHtml) */
function ehAvulsoFixo(id){ var p = pessoa(id); return !!(p && p.avulso); }
function nomeTxt(id, nome){ return (nome || nomeDe(id)) + (ehAvulsoFixo(id) ? ' (avulso)' : ''); }
function nomeHtml(id, nome){ return esc(nome || nomeDe(id)) + (ehAvulsoFixo(id) ? ' <span class="av">(avulso)</span>' : ''); }
function timePor(tid, dia){ dia = dia || S.dia; for (var i = 0; i < dia.times.length; i++) if (dia.times[i].id === tid) return dia.times[i]; return null; }
function nomeTime(tid, dia){ var t = timePor(tid, dia); return t ? t.nome : nomePadrao(tid); }
function nomePadrao(tid){ return 'Time ' + (IDS.indexOf(tid) + 1); }
function corTime(tid, dia){ var t = timePor(tid, dia); return (t && CORES[t.cor]) ? t.cor : (CORES_PADRAO[IDS.indexOf(tid)] || 'preto'); }
function jogoAtual(){ var js = S.dia.jogos; for (var i = js.length - 1; i >= 0; i--) if (!js[i].fim) return js[i]; return null; }
function placar(j){ var c = 0, f = 0; j.gols.forEach(function(g){ if (g.time === j.casa) c++; else if (g.time === j.fora) f++; }); return {casa:c, fora:f}; }
function todosDoDia(){ return S.jogadores.concat(S.dia.avulsos); }
function ordenar(arr){ return arr.slice().sort(function(a,b){ return a.nome.localeCompare(b.nome, 'pt-BR'); }); }

function classificacao(dia){
  var tab = {};
  dia.times.forEach(function(t){ tab[t.id] = {id:t.id, nome:t.nome, cor:t.cor, J:0, V:0, E:0, D:0, GP:0, GC:0, P:0}; });
  dia.jogos.forEach(function(j){
    if (!j.fim) return;
    var a = tab[j.casa], b = tab[j.fora]; if (!a || !b) return;
    var p = placar(j);
    a.J++; b.J++; a.GP += p.casa; a.GC += p.fora; b.GP += p.fora; b.GC += p.casa;
    if (p.casa > p.fora){ a.V++; b.D++; a.P += 3; }
    else if (p.fora > p.casa){ b.V++; a.D++; b.P += 3; }
    else { a.E++; b.E++; a.P++; b.P++; }
  });
  return Object.keys(tab).map(function(k){ return tab[k]; }).sort(function(x,y){
    return y.P - x.P || y.V - x.V || (y.GP - y.GC) - (x.GP - x.GC) || y.GP - x.GP;
  });
}
/* soMensal: deixa os avulsos de fora (a posição é recalculada só entre mensalistas) */
function artilheiros(jogos, soMensal){
  var m = {};
  jogos.forEach(function(j){ j.gols.forEach(function(g){
    if (g.contra || !g.jogador || (soMensal && ehAvulsoFixo(g.jogador))) return;
    var e = m[g.jogador] || (m[g.jogador] = {id:g.jogador, nome:g.nome, gols:0, time:g.time});
    e.gols++; e.nome = g.nome; e.time = g.time;
  }); });
  var arr = Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return b.gols - a.gols || a.nome.localeCompare(b.nome, 'pt-BR'); });
  arr.forEach(function(a){ a.pos = 1 + arr.filter(function(o){ return o.gols > a.gols; }).length; });
  return arr;
}
function golsTotais(){
  var t = {};
  var dias = (S.historico || []).concat([S.dia]);
  dias.forEach(function(d){ d.jogos.forEach(function(j){ j.gols.forEach(function(g){ if (!g.contra && g.jogador) t[g.jogador] = (t[g.jogador] || 0) + 1; }); }); });
  return t;
}
function diasDoMes(mes){ return S.historico.concat([S.dia]).filter(function(d){ return String(d.data).slice(0, 7) === mes && d.jogos.length; }); }
function jogosDoMes(mes){ return diasDoMes(mes).reduce(function(a, d){ return a.concat(d.jogos); }, []); }

function linhaPlacar(j, dia){ var p = placar(j); return nomeTime(j.casa, dia) + ' ' + p.casa + ' x ' + p.fora + ' ' + nomeTime(j.fora, dia); }
/* Uma linha por time, sem repetir o nome: "Time 1: Leo (3), Carlão (avulso, 2), Dudu, gol contra" */
function golsPorTime(j, dia){
  var por = {};
  j.gols.forEach(function(g){ (por[g.time] = por[g.time] || []).push(g); });
  return [j.casa, j.fora].filter(function(t){ return por[t]; }).map(function(t){
    var cont = {}, ordem = [], contra = 'gol contra';
    por[t].forEach(function(g){
      var k = g.contra ? contra : g.nome;
      if (!cont[k]){ cont[k] = {n:0, avulso:!g.contra && ehAvulsoFixo(g.jogador)}; ordem.push(k); }
      cont[k].n++;
    });
    return nomeTime(t, dia) + ': ' + ordem.map(function(k){
      var c = cont[k], extra = [c.avulso ? 'avulso' : '', c.n > 1 ? c.n : ''].filter(Boolean).join(', ');
      return extra ? k + ' (' + extra + ')' : k;
    }).join(', ');
  });
}

function txtResumo(dia, soMensal){

  }

    l.push('', '*Artilheiros' + (soMensal ? ' (só mensalistas)' : '') + '*');
    art.slice(0, 10).forEach(function(a){ l.push((med[a.pos] || '▪️') + ' ' + nomeTxt(a.id, a.nome) + ': ' + a.gols); });

  return l.join('\n');
}

/* Lista colada na aba Elenco pode trazer nível e tipo: "Leo - Bom", "Japa - Médio - avulso".
   "Leo - Bom" → {nome:'Leo', nivel:3, avulso:false}. Sem nível no fim da linha, nivel fica null. */
function lerLinhaElenco(linha){
  var a = linha.match(/^(.*?)\s*[-–—:(]\s*avulso\)?$/i);
  if (a) linha = a[1];
  var m = linha.match(/^(.*?)\s*[-–—:(]\s*(fraco|m[eé]dio|bom|pro)\)?$/i);
  var nv = m ? {fraco:1, medio:2, bom:3, pro:4}[norm(m[2])] : null;
  return {nome: m ? m[1].trim() : linha.trim(), nivel: nv, avulso: !!a};
}

/* Times do dia para o grupo: bolinha da cor do colete, nome do time e os jogadores em ordem.
   O nível de cada um não vai na mensagem. */
var EMOJI_COR = {laranja:'🟠', azul:'🔵', amarelo:'🟡', roxo:'🟣', verde:'🟢', vermelho:'🔴', preto:'⚫', branco:'⚪'};
function txtTimes(){
  var d = S.dia, data = fmtData(d.data);
  var l = ['⚽ *Times do ' + S.grupo + '*', data.charAt(0).toUpperCase() + data.slice(1)];
  d.times.filter(function(t){ return t.jogadores.length; }).forEach(function(t){
    l.push('', (EMOJI_COR[t.cor] || '⚪') + ' *' + t.nome.toUpperCase() + '*');
    t.jogadores.map(function(pid){ return nomeTxt(pid); }).sort(function(a, b){ return a.localeCompare(b, 'pt-BR'); }).forEach(function(n){ l.push(n); });
  });
  return l.join('\n');
}

function txtArtMes(mes, soMensal){

  var l = ['⚽ *Artilharia de ' + fmtMes(mes) + ' · ' + S.grupo + '*' + (soMensal ? '\n_Só mensalistas_' : ''), ''];
  art.forEach(function(a){ l.push((med[a.pos] || '▪️') + ' ' + nomeTxt(a.id, a.nome) + ': ' + a.gols); });

}

/* ---------- regras do jogo ---------- */
function iniciarJogo(c, f){
  var d = S.dia, n = d.jogos.length + 1;
  var ids = d.times.map(function(t){ return t.id; });
  var fila = (d.fila || []).filter(function(t){ return ids.indexOf(t) >= 0 && t !== c && t !== f; });
  ids.forEach(function(t){ if (t !== c && t !== f && fila.indexOf(t) < 0) fila.push(t); });
  d.fila = fila;
  [c, f].forEach(function(t){ if ((d.emCampo || []).indexOf(t) < 0) d.desde[t] = n; });
  d.emCampo = [c, f];
  d.jogos.push({n:n, casa:c, fora:f, gols:[], inicio:Date.now(), fim:null});
  d.proximo = null; d.desempate = null;
}
/* Rodízio: ninguém joga mais de 2 seguidas. Quem chegou a 2 sai, ganhando ou perdendo.
   Se os dois ainda podem ficar (só no 1º jogo), fica quem ganhou; no empate, o app pergunta. */
function encerrarJogo(){
  var d = S.dia, j = jogoAtual(); if (!j) return null;
  j.fim = Date.now();
  /* Quem estava em cada time no fim do jogo (para as estatísticas contarem certo quem chegou atrasado ou trocou de time) */
  j.elenco = {};
  [j.casa, j.fora].forEach(function(t){ var tm = timePor(t); j.elenco[t] = tm ? tm.jogadores.slice() : []; });
  var esperando = (d.fila || []).filter(function(t){ return t !== j.casa && t !== j.fora && timePor(t); });
  if (!esperando.length){ d.fila = []; d.proximo = {casa:j.casa, fora:j.fora}; return j; }
  var p = placar(j);
  var venceu = p.casa > p.fora ? j.casa : p.fora > p.casa ? j.fora : null;
  var podeFicar = [j.casa, j.fora].filter(function(t){ return j.n - (d.desde[t] || j.n) + 1 < 2; });
  var fica = podeFicar.length === 1 ? podeFicar[0] : venceu;
  if (fica) definirQuemFica(j, fica);
  else { d.proximo = null; d.desempate = {jogo:j.n, times:[j.casa, j.fora]}; }
  return j;
}
function definirQuemFica(j, fica){
  var d = S.dia, sai = fica === j.casa ? j.fora : j.casa;
  var fila = (d.fila || []).filter(function(t){ return t !== fica && t !== sai && timePor(t); });
  fila.push(sai);
  d.fila = fila; d.proximo = {casa:fica, fora:fila[0]}; d.desempate = null;
}
function montarTimes(n){
  var ant = S.dia.times;
  return IDS.slice(0, n).map(function(id, i){ return {id:id, nome:(ant[i] && ant[i].nome) || nomePadrao(id), cor:(ant[i] && ant[i].cor) || CORES_PADRAO[i], jogadores:[]}; });
}
function nivelDe(pid){ var p = pessoa(pid); return p ? p.nivel : 2; }
function forca(t){ return t.jogadores.reduce(function(s, pid){ return s + nivelDe(pid); }, 0); }
/* Sorteio em duas etapas:
   1) Pros primeiro, depois bons, médios e fracos. Cada um vai para o time com menos
      jogadores; no empate, para o mais fraco até agora; persistindo, sorteia.
   2) Ajuste fino: troca jogadores de nível diferente entre times enquanto a troca
      deixar tudo mais parelho (mesma força e Pros/fracos espalhados). O tamanho dos times não muda. */
function sortearNivelado(ids, n){
  var times = montarTimes(n), soma = times.map(function(){ return 0; }), ordem = [];
  [4,3,2,1].forEach(function(nv){ ordem = ordem.concat(embaralhar(ids.filter(function(id){ return nivelDe(id) === nv; }))); });
  ordem.forEach(function(id){
    var i = embaralhar(times.map(function(t, k){ return k; })).sort(function(a, b){
      return times[a].jogadores.length - times[b].jogadores.length || soma[a] - soma[b];
    })[0];
    times[i].jogadores.push(id); soma[i] += nivelDe(id);
  });
  ajustarEquilibrio(times);
  return times;
}
/* Nota do sorteio (quanto menor, mais parelho): diferença de força pesa mais;
   depois, diferença na quantidade de Pros e de fracos entre os times. */
function notaEquilibrio(times){
  function dif(f){ var v = times.map(f); return Math.max.apply(null, v) - Math.min.apply(null, v); }
  function qtd(nv){ return function(t){ return t.jogadores.filter(function(pid){ return nivelDe(pid) === nv; }).length; }; }
  return dif(forca) * 100 + dif(qtd(4)) * 10 + dif(qtd(1));
}
function ajustarEquilibrio(times){
  var nota = notaEquilibrio(times);
  for (var volta = 0; volta < 60 && nota > 0; volta++){
    var melhorou = false;
    var pares = [];
    times.forEach(function(a, i){ times.forEach(function(b, k){ if (i < k) pares.push([a, b]); }); });
    embaralhar(pares).forEach(function(par){
      var a = par[0], b = par[1];
      embaralhar(a.jogadores.slice()).forEach(function(x){
        embaralhar(b.jogadores.slice()).forEach(function(y){
          if (melhorou || nivelDe(x) === nivelDe(y)) return;
          var ia = a.jogadores.indexOf(x), ib = b.jogadores.indexOf(y);
          a.jogadores[ia] = y; b.jogadores[ib] = x;
          var nova = notaEquilibrio(times);
          if (nova < nota){ nota = nova; melhorou = true; }
          else { a.jogadores[ia] = x; b.jogadores[ib] = y; }
        });
      });
    });
    if (!melhorou) break;
  }
}

/* ---------- tela ligada durante o jogo ---------- */
async function pedirTelaLigada(){
  try{
    if (visitante() || !jogoAtual() || document.visibilityState !== 'visible' || wakeLock) return;
    if ('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){ wakeLock = null; });
    }
  }catch(e){ wakeLock = null; }
}
function soltarTela(){ try{ if (wakeLock) wakeLock.release(); }catch(e){} wakeLock = null; }

/* ---------- folha (sheet) e aviso (toast) ---------- */
function openSheet(html, depois){
  $('#sheetBody').innerHTML = html;
  $('#sheetBg').hidden = false;
  document.body.classList.add('travado');
  if (depois) depois();
}
function closeSheet(){
  $('#sheetBg').hidden = true;
  $('#sheetBody').innerHTML = '';
  document.body.classList.remove('travado');
}
/* ms: quanto tempo fica na tela (padrão 7 s com botões, 2,8 s sem). Tocar no aviso (fora dos botões) fecha na hora. */
function toast(msg, acoes, ms){
  var el = $('#toast');
  el.innerHTML = '<span class="tx">' + esc(msg) + '</span>' + (acoes ? '<div class="ta">' + acoes + '</div>' : '');
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.hidden = true; }, ms || (acoes ? 7000 : 2800));
}
function esconderToast(){ clearTimeout(toastTimer); $('#toast').hidden = true; }
$('#toast').addEventListener('click', function(e){ if (!e.target.closest('button, a')) esconderToast(); });

function vProximo(){

  if (ult){
    var p = placar(ult), mk = golsPorTime(ult).join('\n');
    h += '<section class="card"><div class="rot">Fim do jogo ' + ult.n + '</div>' +
      '<div class="res"><svg class="colete cor-' + corTime(ult.casa) + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3 3 6.2l2.2 4.3 2.3-1.1V21h9V9.4l2.3 1.1L21 6.2 15.5 3c-.6 1.7-1.9 2.7-3.5 2.7S9.1 4.7 8.5 3z"/></svg>' + esc(nomeTime(ult.casa)) + ' <span class="n">' + p.casa + '</span> x <span class="n">' + p.fora + '</span> ' + esc(nomeTime(ult.fora)) + '<svg class="colete cor-' + corTime(ult.fora) + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3 3 6.2l2.2 4.3 2.3-1.1V21h9V9.4l2.3 1.1L21 6.2 15.5 3c-.6 1.7-1.9 2.7-3.5 2.7S9.1 4.7 8.5 3z"/></svg></div>' +
      (mk ? '<p class="mudo" style="white-space:pre-line">' + esc(mk) + '</p>' : '') +
      (ult.passou ? '<p class="mudo">Empate. ' + esc(nomeTime(ult.passou)) + ' passou.</p>' : '') +
      '<a class="btn zap bloco" href="' + esc(wa(txtFim(ult))) + '" target="_blank" rel="noopener">' + ICON.enviar + 'Mandar resultado no grupo</a></section>';
  }
  var dz = d.desempate;
  if (dz && timePor(dz.times[0]) && timePor(dz.times[1])){
    return h + '<section class="card"><div class="rot">Empate no jogo ' + dz.jogo + '</div><h3>Quem passa?</h3><p class="mudo">Escolha o time que segue em campo para o próximo jogo.</p><div class="col-btns">' +
      dz.times.map(function(t){ return '<button class="btn btn-time grande cor-' + corTime(t) + '" data-a="passa" data-t="' + t + '"><svg class="colete" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3 3 6.2l2.2 4.3 2.3-1.1V21h9V9.4l2.3 1.1L21 6.2 15.5 3c-.6 1.7-1.9 2.7-3.5 2.7S9.1 4.7 8.5 3z"/></svg>' + esc(nomeTime(t)) + '</button>'; }).join('') + '</div></section>';
  }
  var esperando = d.times.filter(function(t){ return t.id !== prox.casa && t.id !== prox.fora; }).map(function(t){ return t.nome; });
  h += '<section class="card"><div class="rot">Jogo ' + (d.jogos.length + 1) + '</div>' +
    '<div class="prox-sel"><select id="selCasa" aria-label="Primeiro time">' + opts(prox.casa) + '</select><span class="vs2">x</span><select id="selFora" aria-label="Segundo time">' + opts(prox.fora) + '</select></div>' +
    (d.times.length > 2 ? '<p class="mudo">Quem ganha fica, mas nenhum time joga mais de 2 seguidas.' + (esperando.length ? ' Esperando: ' + esc(esperando.join(', ')) + '.' : '') + '</p>' : '') +
    '<button class="btn prim bloco grande" data-a="comecar">' + ICON.play + 'Começar jogo ' + (d.jogos.length + 1) + '</button></section>';
  if (!d.jogos.length) h += '<p class="mudo">A tela do celular fica ligada durante o jogo.</p>';
  return h;
}

function segNivel(p){
  return '<div class="niv" role="group" aria-label="Nível de ' + esc(p.nome) + '">' + [1,2,3,4].map(function(n){
    return '<button data-a="nivel" data-p="' + esc(p.id) + '" data-v="' + n + '" aria-pressed="' + (p.nivel === n) + '">' + NIVEIS[n] + '</button>';
  }).join('') + '</div>';
}
function chip(pid){ var p = pessoa(pid); return '<button class="chip' + (ehConvidado(pid) ? ' conv' : p && p.avulso ? ' avul' : '') + '" data-a="chip" data-p="' + esc(pid) + '">' + nomeHtml(pid) + '</button>'; }

function vTimes(){
  var d = S.dia;
  if (!d.times.length){
    return '<div class="vazio"><h2>Times do dia</h2><p>O sorteio equilibra os times pelo nível de cada jogador.</p><div class="col-btns">' +
      '<button class="btn prim" data-a="sortear">' + ICON.dado + 'Sortear os times</button><button class="btn" data-a="manual">' + ICON.mao + 'Montar na mão</button></div>' +
      (S.jogadores.length ? '' : '<p class="mudo">Dica: cadastre os mensalistas e o nível de cada um na aba Elenco.</p>') + '</div>';
  }
  var noTime = {};
  d.times.forEach(function(t){ t.jogadores.forEach(function(p){ noTime[p] = 1; }); });
  var sem = ordenar(todosDoDia().filter(function(p){ return !noTime[p.id] && !p.avulso; }));
  var avFora = ordenar(avulsosFixos().filter(function(p){ return !noTime[p.id]; }));
  var j = jogoAtual();

  h += '<div class="linha-rot"><span class="rot">Quantos times</span><div class="seg">' + [2,3,4].map(function(n){ return '<button data-a="qtdTimes" data-v="' + n + '" aria-pressed="' + (d.times.length === n) + '">' + n + '</button>'; }).join('') + '</div></div>';
  h += d.times.map(function(t){
    return '<section class="time-card cor-' + t.cor + '"><div class="time-head"><button class="swatch" data-a="cor" data-t="' + t.id + '" aria-label="Trocar a cor do colete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3 3 6.2l2.2 4.3 2.3-1.1V21h9V9.4l2.3 1.1L21 6.2 15.5 3c-.6 1.7-1.9 2.7-3.5 2.7S9.1 4.7 8.5 3z"/></svg></button>' +
      '<input class="tnome" id="tnome-' + t.id + '" data-t="' + t.id + '" value="' + esc(t.nome) + '" maxlength="20" aria-label="Nome do time"><span class="mudo forca">' + t.jogadores.length + ' · força ' + forca(t) + '</span></div>' +
      '<div class="chips">' + (t.jogadores.map(chip).join('') || '<span class="mudo">Ninguém ainda. Toque num nome em "Sem time".</span>') + '</div></section>';
  }).join('');
  if (d.times.some(function(t){ return t.jogadores.length; })) h += '<div class="col-btns"><a class="btn zap bloco grande" href="' + esc(wa(txtTimes())) + '" target="_blank" rel="noopener">' + ICON.enviar + 'Mandar times no grupo</a>' +
    '<button class="btn-link" data-a="copiar" data-txt="times">Copiar o texto dos times</button></div>';
  h += '<section class="bloco-f"><div class="rot">Sem time (' + sem.length + ')</div>' + (sem.length ? '<div class="chips">' + sem.map(function(p){ return chip(p.id); }).join('') + '</div>' : '<p class="mudo">Todo mundo já está num time.</p>') +
    (avFora.length ? '<div class="rot">Avulsos fora dos times (' + avFora.length + ')</div><div class="chips">' + avFora.map(function(p){ return chip(p.id); }).join('') + '</div>' : '') +
    '</section>';
  h += '<button class="btn perigo bloco" data-a="limparTimes">Limpar os times</button>';
  return h;
}

function vResumo(){
  var d = S.dia;
  if (!d.jogos.length){
    return '<div class="vazio"><h2>Resumo do dia</h2><p>Os jogos, a classificação e os artilheiros aparecem aqui assim que o primeiro jogo começar.</p></div>' + vMes() + vHistorico();
  }
  var cls = classificacao(d), art = artilheiros(d.jogos, soMensal);

    (lider ? '<span class="v">' + esc(lider.nome) + '</span><span class="s">' + pl(lider.V, 'vitória', 'vitórias') + ' · ' + lider.P + ' pts</span>' : '<span class="v">—</span><span class="s">Nenhum jogo encerrado</span>') +
    '</div><div class="dest"><span class="rot">Artilharia</span>' +
    (topo.length ? '<span class="v">' + topo.map(function(a){ return nomeHtml(a.id, a.nome); }).join(', ') + '</span><span class="s">' + pl(topo[0].gols, 'gol', 'gols') + '</span>' : '<span class="v">—</span><span class="s">Sem gols ainda</span>') + '</div></div>';
  h += '<section class="bloco-f"><div class="rot">Classificação</div><div class="tabela-wrap"><table><thead><tr><th>Time</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr></thead><tbody>' +
    cls.map(function(c){ var sg = c.GP - c.GC; return '<tr><td class="tm"><svg class="colete cor-' + c.cor + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3 3 6.2l2.2 4.3 2.3-1.1V21h9V9.4l2.3 1.1L21 6.2 15.5 3c-.6 1.7-1.9 2.7-3.5 2.7S9.1 4.7 8.5 3z"/></svg>' + esc(c.nome) + '</td><td class="pts">' + c.P + '</td><td>' + c.J + '</td><td>' + c.V + '</td><td>' + c.E + '</td><td>' + c.D + '</td><td>' + (sg > 0 ? '+' : '') + sg + '</td></tr>'; }).join('') +
    '</tbody></table></div></section>';
  var ed = !visitante(); /* visitante só vê: sem tocar para apagar, sem encerrar, sem mandar */
  h += '<section class="bloco-f"><div class="linha-rot"><span class="rot">Artilheiros</span>' + filtroRank() + '</div>' + (art.length ? '<ol class="rank">' + art.map(function(a){
    var miolo = '<span class="pos">' + a.pos + 'º</span><span class="quem"><svg class="colete cor-' + corTime(a.time) + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3 3 6.2l2.2 4.3 2.3-1.1V21h9V9.4l2.3 1.1L21 6.2 15.5 3c-.6 1.7-1.9 2.7-3.5 2.7S9.1 4.7 8.5 3z"/></svg><span class="nm">' + nomeHtml(a.id, a.nome) + '</span></span><span class="g">' + a.gols + '</span>';
    return ed ? '<li class="cl"><button class="linha-bt" data-a="golsDe" data-p="' + esc(a.id) + '">' + miolo + '</button></li>' : '<li>' + miolo + '</li>';
  }).join('') + '</ol>' : '<p class="mudo">' + (soMensal ? 'Nenhum gol de mensalista ainda.' : 'Nenhum gol marcado ainda.') + '</p>') + '</section>';
  h += '<section class="bloco-f"><div class="rot">Jogos</div><ul class="jogos">' + d.jogos.map(function(j){
    var mk = golsPorTime(j).map(function(s){ return '<span class="mudo" style="display:block">' + esc(s) + '</span>'; }).join('');
    var miolo = '<div class="l1"><span class="n">' + j.n + '</span><span>' + esc(linhaPlacar(j)) + '</span>' + (j.fim ? '' : '<span class="tag">Agora</span>') + '</div>' + mk;
    return ed ? '<li class="cl"><button class="linha-bt" data-a="verJogo" data-n="' + j.n + '">' + miolo + '</button></li>' : '<li>' + miolo + '</li>';
  }).join('') + '</ul>' + (ed ? '<p class="mudo">Toque num jogo ou num artilheiro para corrigir ou apagar gols.</p>' : '') + '</section>';
  if (ed) h += '<div class="col-btns"><a class="btn zap" href="' + esc(wa(txtResumo(d, soMensal))) + '" target="_blank" rel="noopener">' + ICON.enviar + 'Mandar resumo no grupo' + rotFiltro() + '</a><button class="btn" data-a="copiar" data-txt="resumo">Copiar o texto do resumo</button><button class="btn perigo" data-a="encerrarDia">Encerrar o dia</button>' +
    '<button class="btn-link perigo-link" data-a="apagarJogos">Apagar todos os jogos de hoje</button></div>';
  return h + vMes() + vHistorico();
}

/* Filtro dos rankings: "Todos" ou "Só mensalistas". Vale para a tela e para o que vai pro WhatsApp.
   Só aparece se tiver avulso cadastrado. */
function filtroRank(){
  if (!avulsosFixos().length) return '';
  return '<div class="seg" role="group" aria-label="Quem entra no ranking">' + [['0', 'Todos'], ['1', 'Só mensalistas']].map(function(o){
    return '<button data-a="filtroRank" data-v="' + o[0] + '" aria-pressed="' + (soMensal === (o[0] === '1')) + '">' + o[1] + '</button>';
  }).join('') + '</div>';
}
function rotFiltro(){ return avulsosFixos().length ? (soMensal ? ' (só mensalistas)' : ' (com avulsos)') : ''; }

function vMes(){
  var art = artilheiros(jogosDoMes(mesSel), soMensal), dias = diasDoMes(mesSel).length, nome = fmtMes(mesSel);
  var h = '<section class="bloco-f"><div class="linha-rot"><span class="rot">Artilharia do mês</span>' + filtroRank() + '</div><div class="mes">' +
    '<button class="btn mini" data-a="mes" data-v="-1" aria-label="Mês anterior">‹</button><b>' + esc(nome.charAt(0).toUpperCase() + nome.slice(1)) + '</b>' +
    '<button class="btn mini" data-a="mes" data-v="1" aria-label="Próximo mês"' + (mesSel >= hojeISO().slice(0, 7) ? ' disabled' : '') + '>›</button></div>';
  if (!art.length) return h + '<p class="mudo">' + (soMensal ? 'Nenhum gol de mensalista neste mês.' : 'Nenhum gol neste mês.') + '</p></section>';
  return h + '<ol class="rank">' + art.map(function(a){
    return '<li><span class="pos">' + a.pos + 'º</span><span class="quem"><span class="nm">' + nomeHtml(a.id, a.nome) + '</span></span><span class="g">' + a.gols + '</span></li>';
  }).join('') + '</ol><p class="mudo">' + pl(dias, 'dia', 'dias') + ' de jogo no mês.</p>' + (visitante() ? '</section>' :
    '<a class="btn zap" href="' + esc(wa(txtArtMes(mesSel, soMensal))) + '" target="_blank" rel="noopener">' + ICON.enviar + 'Mandar artilharia do mês' + rotFiltro() + '</a></section>');
}

function vHistorico(){
  if (!S.historico.length) return '';
  return '<section class="bloco-f"><div class="rot">Dias anteriores</div>' + S.historico.slice(0, 30).map(function(hd){
    var cls = classificacao(hd), art = artilheiros(hd.jogos);
    var top = art.filter(function(a){ return a.pos === 1; });
    return '<details class="dia"><summary><span>' + esc(fmtData(hd.data)) + '</span><span class="mudo">' + pl(hd.jogos.length, 'jogo', 'jogos') + (cls[0] && cls[0].J ? ' · ' + esc(cls[0].nome) : '') + '</span></summary><div class="dia-in">' +
      (top.length ? '<p>Artilharia: <b>' + top.map(function(a){ return nomeHtml(a.id, a.nome); }).join(', ') + '</b> (' + pl(top[0].gols, 'gol', 'gols') + ')</p>' : '') +
      '<p class="mudo">' + esc(hd.jogos.map(function(j){ return linhaPlacar(j, hd); }).join(' · ')) + '</p>' +
      (visitante() ? '' : '<a class="btn zap" href="' + esc(wa(txtResumo(hd))) + '" target="_blank" rel="noopener">' + ICON.enviar + 'Mandar no grupo</a>' +
      '<button class="btn-link perigo-link" data-a="apagarDia" data-d="' + esc(hd.id) + '">Apagar este dia</button>') + '</div></details>';
  }).join('') + '</section>';
}

function vElenco(){
  var tot = golsTotais();
  var h = '<section class="bloco-f"><label class="rot" for="grupoNome">Nome do grupo</label><input type="text" id="grupoNome" value="' + esc(S.grupo) + '" maxlength="30"></section>';
  function lista(arr){
    return '<ul class="lista">' + ordenar(arr).map(function(p){
      return '<li><div class="pinfo"><button class="nm" data-a="renomear" data-p="' + esc(p.id) + '" aria-label="Editar ' + esc(p.nome) + '">' + esc(p.nome) + '</button><span class="gl">' + pl(tot[p.id] || 0, 'gol', 'gols') + '</span></div>' + segNivel(p) + '<button class="x" data-a="removerJog" data-p="' + esc(p.id) + '" aria-label="Remover ' + esc(p.nome) + '">' + ICON.x + '</button></li>';
    }).join('') + '</ul>';
  }
  /* Filtro por nível: mostra só quem é daquele nível nas duas listas (0 = todos) */
  function doNivel(arr){ return filtroNivel ? arr.filter(function(p){ return p.nivel === filtroNivel; }) : arr; }
  function conta(arr, total){ return filtroNivel ? arr.length + ' de ' + total : String(total); }
  var msT = mensalistas(), avT = avulsosFixos(), ms = doNivel(msT), av = doNivel(avT);
  if (S.jogadores.length) h += '<section class="bloco-f"><div class="rot">Filtrar por nível</div><div class="filtros">' +
    [[0, 'Todos', S.jogadores.length]].concat([1,2,3,4].map(function(n){ return [n, NIVEIS[n], S.jogadores.filter(function(p){ return p.nivel === n; }).length]; })).map(function(o){
      return '<button class="chip" data-a="filtroNivel" data-v="' + o[0] + '" aria-pressed="' + (filtroNivel === o[0]) + '">' + o[1] + ' <b>' + o[2] + '</b></button>';
    }).join('') + '</div></section>';
  var vazioFiltro = '<p class="mudo">Ninguém com nível ' + (NIVEIS[filtroNivel] || '') + ' aqui.</p>';
  h += '<section class="bloco-f"><div class="rot">Mensalistas (' + conta(ms, msT.length) + ')</div>' +
    '<form class="linha" data-f="add"><input type="text" id="novoNome" placeholder="Nome ou apelido" autocomplete="off" enterkeyhint="done"><button class="btn prim">Adicionar</button></form>' +
    '<button class="btn-link" data-a="colar">Colar uma lista de nomes</button>' +
    (ms.length ? lista(ms) + '<p class="mudo">O nível serve para o sorteio equilibrar os times. Gols somam todos os dias guardados. Toque no nome para corrigir ou mudar para avulso.</p>' : msT.length ? vazioFiltro : '<p class="mudo">Nenhum mensalista ainda. Digite um nome acima ou cole a lista do grupo.</p>') + '</section>';
  h += '<section class="bloco-f"><div class="rot">Avulsos (' + conta(av, avT.length) + ')</div>' +
    '<p class="mudo">Quem joga às vezes sem ser mensalista. Ficam guardados com o nível, e no sorteio é só marcar quem veio.</p>' +
    '<form class="linha" data-f="addAv"><input type="text" id="novoAvulso" placeholder="Nome do avulso" autocomplete="off" enterkeyhint="done"><button class="btn prim">Adicionar</button></form>' +
    (av.length ? lista(av) : avT.length ? vazioFiltro : '') + '</section>';
  if (!demo) h += '<section class="card"><div class="rot">Conta</div>' + (usuario
    ? '<p>Conectado como <b>' + esc(usuario.email || '') + '</b>.</p><p class="mudo">Os dados ficam guardados na internet e iguais nos celulares de quem marca os jogos.</p><button class="btn" data-a="conta">Ver minha conta</button><button class="btn" data-a="verComoVisitante">Ver como visitante</button>'
    : '<p class="mudo">Entre com seu e-mail e senha para guardar os dados na internet e deixar tudo igual nos celulares de quem marca os jogos.</p><button class="btn prim" data-a="conta">Entrar</button>') + '</section>';
  if (!demo) h += '<section class="card"><div class="rot">Testar antes</div><p>Quer ver o app funcionando com jogadores de mentira? Nada do que fizer no exemplo fica salvo.</p><button class="btn" data-a="exemplo">Ver com dados de exemplo</button></section>';
  return h;
}

/* ---------- visitante ---------- */
/* Elenco do visitante: só nomes e gols (os dados da vitrine nem têm os níveis) */
function vElencoVisitante(){
  var tot = golsTotais();
  function lista(arr){
    return '<ul class="lista">' + ordenar(arr).map(function(p){
      return '<li><div class="pinfo"><span class="nm" style="cursor:auto">' + esc(p.nome) + '</span></div><span class="gl" style="padding-right:14px">' + pl(tot[p.id] || 0, 'gol', 'gols') + '</span></li>';
    }).join('') + '</ul>';
  }
  var ms = mensalistas(), av = avulsosFixos();
  if (!S.jogadores.length) return '<div class="vazio"><h2>Elenco</h2><p>Os nomes ainda não carregaram. Confira a internet e toque no ícone de pessoa, lá em cima, para atualizar.</p></div>';
  var h = '<section class="bloco-f"><div class="rot">Mensalistas (' + ms.length + ')</div>' + (ms.length ? lista(ms) : '<p class="mudo">Nenhum mensalista.</p>') + '</section>';
  if (av.length) h += '<section class="bloco-f"><div class="rot">Avulsos (' + av.length + ')</div><p class="mudo">Quem joga às vezes sem ser mensalista.</p>' + lista(av) + '</section>';
  return h + '<p class="mudo">Gols somam todos os dias guardados no app.</p>';
}

/* Sortear do visitante: marca quem veio e o servidor sorteia pelo nível (que o celular do visitante não vê).
   Nada é salvo: não cria jogo, não marca gol e não mexe nos times do dia. */
var vsMarc = {}, vsConv = [], vsN = 0, vsRes = null, vsCarregando = false;
function marcadoVS(p){ return Object.prototype.hasOwnProperty.call(vsMarc, p.id) ? vsMarc[p.id] : !p.avulso; }
function vsContagem(){
  var k = S.jogadores.filter(marcadoVS).length + vsConv.length, n = vsN || qtdSugerida(k);
  return {k:k, n:n};
}
function vsInfoTxt(){
  var c = vsContagem(), por = Math.floor(c.k / c.n), extra = c.k % c.n;
  return pl(c.k, 'jogador', 'jogadores') + ' · ' + por + (extra ? ' a ' + (por + 1) : '') + ' por time' + (vsN ? '' : ' (o app sugeriu ' + c.n + ' times)');
}
function atualizarVsInfo(){
  var c = vsContagem(), el = $('#vsInfo');
  if (el) el.textContent = vsInfoTxt();
  $$('[data-a="vsQtd"]').forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.v === c.n)); });
}
function vSortear(){
  if (!S.jogadores.length) return '<div class="vazio"><h2>Sortear times</h2><p>Os nomes ainda não carregaram. Confira a internet e tente de novo.</p></div>';
  if (vsRes) return vSorteioPronto();
  var c = vsContagem();
  function checks(arr){
    return '<div class="checks">' + ordenar(arr).map(function(p){ return '<label class="ck"><input type="checkbox" data-vs value="' + esc(p.id) + '"' + (marcadoVS(p) ? ' checked' : '') + '><span>' + esc(p.nome) + '</span></label>'; }).join('') + '</div>';
  }
  var av = avulsosFixos();
  return '<section class="bloco-f"><h2>Sortear times</h2>' +

    (av.length ? '<div class="rot">Avulsos</div>' + checks(av) : '') +

function tempoDesde(iso){
  var p = String(iso).split('-').map(Number); if (p.length !== 3 || !p[0]) return '';
  var h = new Date(), meses = (h.getFullYear() - p[0]) * 12 + (h.getMonth() + 1 - p[1]) - (h.getDate() < p[2] ? 1 : 0);
  if (meses < 1) return 'Menos de um mês';
  var a = Math.floor(meses / 12), m = meses % 12;
  return [a ? pl(a, 'ano', 'anos') : '', m ? pl(m, 'mês', 'meses') : ''].filter(Boolean).join(' e ');

/* ---------- estatísticas por jogador ----------
   Sai do que o app já guarda: os times de cada dia e o placar de cada jogo encerrado.
   Quem estava no time: a escalação do fim do jogo (jogos novos) ou os times do dia (jogos antigos).
   Aproveitamento = pontos ganhos / pontos possíveis (vitória 3, empate 1). Só entra quem está no Elenco. */
var PERIODOS = {mes:'Este mês', ano:'Este ano', tudo:'Desde o início'};
var ORDENS = {aprov:'Aproveitamento', vit:'Vitórias', jogos:'Jogos', gols:'Gols', gpn:'Gols por noite'};
function diasDoPeriodo(per){
  var hoje = hojeISO();
  return S.historico.concat([S.dia]).filter(function(d){
    if (!d.jogos.length) return false;
    var dt = String(d.data);
    return per === 'mes' ? dt.slice(0, 7) === hoje.slice(0, 7) : per === 'ano' ? dt.slice(0, 4) === hoje.slice(0, 4) : true;
  });
}
function estatisticas(per, soMensal){
  var m = {};
  S.jogadores.forEach(function(p){
    if (soMensal && p.avulso) return;
    m[p.id] = {id:p.id, nome:p.nome, noites:0, J:0, V:0, E:0, D:0, gols:0, melhor:null};
  });
  diasDoPeriodo(per).forEach(function(d){
    var jogou = {}, golsNoite = {};
    d.jogos.forEach(function(j){
      if (!j.fim) return; /* jogo em andamento entra quando acabar */
      j.gols.forEach(function(g){ if (!g.contra && g.jogador && m[g.jogador]){ m[g.jogador].gols++; golsNoite[g.jogador] = (golsNoite[g.jogador] || 0) + 1; jogou[g.jogador] = 1; } });
      var p = placar(j);
      [[j.casa, p.casa - p.fora], [j.fora, p.fora - p.casa]].forEach(function(x){
        var ids = (j.elenco && j.elenco[x[0]]) || ((timePor(x[0], d) || {}).jogadores) || [];
        ids.forEach(function(pid){
          var e = m[pid]; if (!e) return;
          e.J++; jogou[pid] = 1;
          if (x[1] > 0) e.V++; else if (x[1] < 0) e.D++; else e.E++;
        });
      });
    });
    Object.keys(jogou).forEach(function(pid){
      var e = m[pid]; e.noites++;
      var g = golsNoite[pid] || 0;
      if (g && (!e.melhor || g > e.melhor.gols)) e.melhor = {gols:g, data:d.data};
    });
  });
  return Object.keys(m).map(function(k){
    var e = m[k];
    e.aprov = e.J ? Math.round((3 * e.V + e.E) / (3 * e.J) * 100) : 0;
    e.gpn = e.noites ? e.gols / e.noites : 0;
    return e;
  }).filter(function(e){ return e.noites; });
}
function num1(x){ return (Math.round(x * 10) / 10).toLocaleString('pt-BR'); }
function valorOrdem(e, ord){ return ord === 'aprov' ? e.aprov + '%' : ord === 'vit' ? e.V : ord === 'jogos' ? e.J : ord === 'gols' ? e.gols : num1(e.gpn); }
function ordenarEstat(arr, ord){
  var chave = {
    aprov: function(e){ return [e.aprov, e.J, e.V]; }, vit: function(e){ return [e.V, e.aprov, e.J]; },
    jogos: function(e){ return [e.J, e.noites, e.aprov]; }, gols: function(e){ return [e.gols, e.gpn, 0]; }, gpn: function(e){ return [e.gpn, e.gols, 0]; }
  }[ord];
  var lista = arr.slice().sort(function(a, b){
    var ka = chave(a), kb = chave(b);
    for (var i = 0; i < ka.length; i++) if (kb[i] !== ka[i]) return kb[i] - ka[i];
    return a.nome.localeCompare(b.nome, 'pt-BR');
  });
  lista.forEach(function(e){ var v = chave(e)[0]; e.pos = 1 + lista.filter(function(o){ return chave(o)[0] > v; }).length; });
  return lista;
}
function vEstat(){
  var arr = ordenarEstat(estatisticas(statPer, soMensal), statOrd);
  function chips(obj, atual, acao){
    return '<div class="filtros">' + Object.keys(obj).map(function(k){ return '<button class="chip" data-a="' + acao + '" data-v="' + k + '" aria-pressed="' + (k === atual) + '">' + obj[k] + '</button>'; }).join('') + '</div>';

    chips(PERIODOS, statPer, 'statPer') + '<div class="rot">Ordenar por</div>' + chips(ORDENS, statOrd, 'statOrd');
  if (!arr.length) return h + '<p class="mudo">Aparece aqui depois do primeiro jogo encerrado ' + (statPer === 'mes' ? 'neste mês' : statPer === 'ano' ? 'neste ano' : 'no app') + '.</p></section>';
  h += '<ol class="rank estat">' + arr.map(function(e){
    return '<li class="cl"><button class="linha-bt" data-a="verEstat" data-p="' + esc(e.id) + '"><span class="pos">' + e.pos + 'º</span>' +
      '<span class="quem" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="nm">' + nomeHtml(e.id, e.nome) + '</span>' +
      '<span class="mudo" style="white-space:normal;font-size:13px">' + pl(e.J, 'jogo', 'jogos') + ' · ' + e.V + 'V ' + e.E + 'E ' + e.D + 'D · ' + e.aprov + '% · ' + pl(e.gols, 'gol', 'gols') + '</span></span>' +
      '<span class="g">' + valorOrdem(e, statOrd) + '</span></button></li>';
  }).join('') + '</ol><p class="mudo">Aproveitamento: vitória vale 3 pontos e empate 1, sobre o total possível. Gols por noite: gols divididos pelas noites em que jogou. Toque num nome para ver a ficha.</p></section>';
  return h;
}
function folhaEstat(pid){

  if (!e){ closeSheet(); return; }
  function box(rot, v, s){ return '<div class="dest"><span class="rot">' + rot + '</span><span class="v">' + v + '</span>' + (s ? '<span class="s">' + s + '</span>' : '') + '</div>'; }

/* Lista colada: "Nome - número" por linha. Aceita também "Nome - Nome na camisa - número" (fica o 1º e o último). */
function lerPessoasUnif(txt){
  return String(txt || '').split(/\r?\n/).map(function(l){
    var partes = l.split(/\s+[-–—]\s*|\s*[-–—]\s+/).map(function(x){ return x.trim(); }).filter(Boolean);
    if (!partes.length) return null;
    var nome = limparNome(partes[0]), ult = partes.length > 1 ? partes[partes.length - 1] : '';

    return nome ? {nome:nome, num:num} : null;
  }).filter(Boolean);
}

/* A biblioteca vem da internet sem travar a abertura do app; se o celular abriu sem sinal, tenta de novo quando a conexão voltar */
var carregandoLib = false;
function carregarNuvem(){
  if (sb || carregandoLib) return;
  carregandoLib = true;
  var s = document.createElement('script');
  s.src = NUVEM_LIB; s.async = true;
  s.onload = function(){ carregandoLib = false; iniciarNuvem(); };

}
function iniciarNuvem(){
  if (!window.supabase) return;
  sb = window.supabase.createClient(NUVEM_URL, NUVEM_CHAVE);
  sb.auth.onAuthStateChange(function(ev, sessao){
    var u = sessao ? sessao.user : null, trocou = (u && u.id) !== (usuario && usuario.id);
    usuario = u;

    if (!u){ if (canal) sb.removeChannel(canal); canal = null; renderSeguro(); return; }
    /* setTimeout: a biblioteca pede para não chamar o banco dentro deste aviso */
    if (trocou){ renderSeguro(); setTimeout(function(){ sincronizar(true); }, 0); }
  });
  if (visitante()) carregarVitrine();

async function sincronizar(forcar){
  if (visitante()){ carregarVitrine(); return; }
  if (!sb || !usuario || escolhaRemota) return;
  if (!forcar && Date.now() - ultimaSinc < 10000) return;
  ultimaSinc = Date.now();
  var marca = lerMarca(), local = dadosReais();
  pendente = !!marca.pendente;
  nuvem = 'enviando'; atualizarSelo();
  var r = await sb.from('futebas').select('dados').eq('id', NUVEM_ID).maybeSingle();
  if (r.error){ nuvem = 'offline'; atualizarSelo(); return; }
  var remoto = r.data && r.data.dados;
  if (!remoto){ await enviar(); ligarCanal(); return; } /* internet vazia: este aparelho sobe o que tem (e a vitrine) */
  var remT = +remoto.atualizadoEm || 0;
  if (marca.base === undefined && temDados(local) && remT !== local.atualizadoEm){ perguntarQualUsar(remoto); return; }
  if (remT > (local.atualizadoEm || 0)) aplicarRemoto(remoto);
  else if ((local.atualizadoEm || 0) > remT) await enviar();
  else { pendente = false; gravarMarca(remT); nuvem = 'ok'; atualizarSelo(); }
  ligarCanal();
  enviarVitrine();
}
function aplicarRemoto(dados){
  if (visitante()) return;

  try{ localStorage.setItem(LS, JSON.stringify(st)); }catch(e){}
  pendente = false; gravarMarca(st.atualizadoEm); nuvem = 'ok';
  if (!jogoAtual()) soltarTela();
  renderSeguro();
}
function agendarEnvio(){
  if (visitante() || !sb || !usuario || escolhaRemota) return;
