  clearTimeout(envioTimer); envioTimer = setTimeout(enviar, 700);
}
async function enviar(){
  if (!sb || !usuario || visitante()) return;
  clearTimeout(envioTimer);
  var dados = dadosReais();
  nuvem = 'enviando'; atualizarSelo();
  var r = await sb.from('futebas').upsert({id:NUVEM_ID, dados:dados, atualizado_em:new Date().toISOString()});
  if (r.error){ pendente = true; gravarMarca(lerMarca().base || 0); nuvem = 'offline'; atualizarSelo(); return; }
  if (dadosReais().atualizadoEm === dados.atualizadoEm) pendente = false; /* se mudou de novo no meio, o próximo envio já está agendado */
  gravarMarca(dados.atualizadoEm); nuvem = 'ok'; atualizarSelo();
  enviarVitrine();
}
/* Aviso em tempo real: quando o outro celular muda algo, este recebe na hora */
function ligarCanal(){
  if (canal || !sb) return;
  canal = sb.channel('futebas-dados').on('postgres_changes', {event:'*', schema:'public', table:'futebas', filter:'id=eq.' + NUVEM_ID}, function(m){
    var d = m.new && m.new.dados;
    if (d && !escolhaRemota && (+d.atualizadoEm || 0) > (dadosReais().atualizadoEm || 0)) aplicarRemoto(d);
  }).subscribe();
}

/* Vitrine: cópia dos dados SEM os níveis, na tabela "futebas_publico", que qualquer um pode ler.

var canalVitrine = null, ultimaVitrine = null, vitrineEm = 0;
function semNiveis(st){ return JSON.parse(JSON.stringify(st, function(k, v){ return k === 'nivel' ? undefined : v; })); }
async function enviarVitrine(){

  if (!r.error) ultimaVitrine = d.atualizadoEm; /* se a tabela ainda não existe, tenta de novo no próximo envio */

    if (avisar || !S.jogadores.length) toast(r.error ? 'Não deu para carregar os dados agora. Confira a internet.' : 'Os dados ainda não foram liberados pelo administrador.');

    var d = m.new && m.new.dados;
    if (d && visitante()) aplicarVitrine(d);

function fecharCanalVitrine(){ if (canalVitrine && sb) sb.removeChannel(canalVitrine); canalVitrine = null; }

/* 1º login num aparelho que já tem dados diferentes dos da internet: a pessoa escolhe qual vale */
function resumoDados(st){ return pl(st.jogadores.length, 'jogador', 'jogadores') + ' · ' + pl(st.historico.length, 'dia guardado', 'dias guardados') + (st.dia.jogos.length ? ' · ' + pl(st.dia.jogos.length, 'jogo hoje', 'jogos hoje') : ''); }
function perguntarQualUsar(remoto){
  escolhaRemota = normalizar(remoto);
  openSheet('<h3>Qual lista vale?</h3><p>Este aparelho e a internet têm dados diferentes. Escolha quais ficam; os outros são substituídos.</p>' +
    '<div class="card"><div class="rot">Na internet</div><p>' + esc(resumoDados(escolhaRemota)) + '</p><button class="btn prim" data-a="usarNuvem">Usar os da internet</button></div>' +
    '<div class="card"><div class="rot">Neste aparelho</div><p>' + esc(resumoDados(dadosReais())) + '</p><button class="btn" data-a="usarLocal">Usar os deste aparelho</button></div>');
}
A.usarNuvem = function(){ var st = escolhaRemota; escolhaRemota = null; closeSheet(); aplicarRemoto(st); ligarCanal(); toast('Pronto, usando os dados da internet'); };
A.usarLocal = function(){ escolhaRemota = null; closeSheet(); salvar(); ligarCanal(); toast('Pronto, os dados deste aparelho vão para a internet'); };

var loginPedido = false;
function entrar(email, senha){
  var msg = $('#loginMsg');
  loginPedido = true;
  if (!sb){ msg.textContent = 'Sem internet agora. Tente de novo quando conectar.'; return; }
  msg.textContent = 'Entrando…';
  sb.auth.signInWithPassword({email:email, password:senha}).then(function(r){
    if (r.error){ msg.textContent = /invalid/i.test(r.error.message) ? 'E-mail ou senha incorretos.' : 'Não deu para entrar agora. Confira a internet e tente de novo.'; return; }
    closeSheet(); toast('Entrou! Sincronizando os dados…');
  });
}
A.conta = function(){
  if (visitante()){
    openSheet('<div class="conta-top">' + htmlAvatar(true) + '<div><h3>Visitante</h3><span class="mudo">Só visualização</span></div></div><p class="mudo">Pode ver o resumo, o elenco e as estatísticas, e sortear times. Nada do que fizer aqui muda os dados do Futebas.</p>' +
      (usuario ? '<p class="mudo">Conectado como <b>' + esc(usuario.email || '') + '</b>: dá para voltar a ser administrador sem digitar a senha.</p>' : '') +
      '<button class="btn prim bloco" data-a="vsAtualizar">Atualizar os dados</button><button class="btn bloco" data-a="entrarAdmin">' + (usuario ? 'Voltar a ser administrador' : 'Entrar como administrador') + '</button>' +
      (usuario ? '<button class="btn bloco perigo" data-a="sair">Sair da conta</button>' : '<button class="btn bloco" data-a="voltarInicio">Voltar à tela de entrada</button>') + '<button class="btn bloco" data-a="fechar">Fechar</button>');
    return;
  }
  if (demo){ toast('No modo exemplo nada é salvo nem sincronizado.'); return; }
  if (!sb){ toast('Sem internet agora. Os dados seguem salvos neste aparelho.'); return; }
  if (!usuario){
    openSheet('<h3>Entrar</h3><p class="mudo">Com login, os dados ficam guardados na internet e iguais nos celulares de quem marca os jogos.</p>' +
      '<form class="col-btns" data-f="login"><input type="email" id="loginEmail" autocomplete="username" inputmode="email" placeholder="E-mail" required><input type="password" id="loginSenha" autocomplete="current-password" placeholder="Senha" required>' +
      '<p class="mudo" id="loginMsg" role="status"></p><button class="btn prim bloco">Entrar</button></form><button class="btn bloco" data-a="fechar">Cancelar</button>', function(){ $('#loginEmail').focus(); });
    return;
  }
  var txt = nuvem === 'offline' ? 'Sem internet agora. As mudanças ficam neste aparelho e vão para a internet quando a conexão voltar.' : pendente ? 'Enviando as últimas mudanças…' : 'Tudo guardado na internet.';
  openSheet('<div class="conta-top">' + htmlAvatar(true) + '<div><b>' + esc(usuario.email || '') + '</b><span class="mudo">Administrador</span></div></div><p class="mudo">' + txt + '</p>' +
    '<button class="btn prim bloco" data-a="sincAgora">Sincronizar agora</button>' +
    '<button class="btn bloco" data-a="verComoVisitante">Ver como visitante</button><p class="mudo">Mostra o app igual o pessoal vê. Para voltar, toque no ícone de pessoa lá em cima e em "Voltar a ser administrador".</p>' +
    '<button class="btn bloco perigo" data-a="sair">Sair da conta</button><p class="mudo">Volta para a tela de entrada. Os dados continuam guardados na internet.</p><button class="btn bloco" data-a="fechar">Fechar</button>');
};
A.sincAgora = function(){ closeSheet(); sincronizar(true); };
/* Administrador logado vê o app como visitante, sem sair da conta. Antes, manda o que estiver pendente. */
A.verComoVisitante = async function(){
  closeSheet();
  if (pendente || envioTimer){ await enviar(); await enviarVitrine(); }
  if (canal && sb) sb.removeChannel(canal); canal = null;
  gravarModo('visitante'); S = lerVitrine(); aba = 'resumo';
  try{ localStorage.setItem(LS_ABA, aba); }catch(e){}
  vitrineEm = 0; render(); window.scrollTo(0, 0); carregarVitrine();
  toast('Agora você vê o app como o pessoal vê');
};
A.sair = function(){ closeSheet(); sb.auth.signOut().then(function(){ gravarModo(null); render(); toast('Saiu da conta. Os dados continuam guardados neste aparelho.'); }); };

window.addEventListener('online', function(){ if (!sb) carregarNuvem(); else sincronizar(true); });
setInterval(function(){ if (pendente && usuario && navigator.onLine) enviar(); }, 30000);

/* ---------- início ---------- */
try{ var salva = localStorage.getItem(LS_ABA); if (salva && /^(jogo|times|resumo|elenco|futebas|sortear)$/.test(salva)) aba = salva; }catch(e){}
if (!S.jogadores.length && !S.dia.times.length && !S.dia.jogos.length) aba = 'jogo';
else if (jogoAtual()) aba = 'jogo';
render();
pedirTelaLigada();
carregarNuvem();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js').catch(function(){});
})();
</script>
</body>
</html>
